<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>インブル練習</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- プレイ画面 -->
    <div id="gameScreen">

        <div class="card">

            <h1>インブル練習</h1>

            <div id="score" class="score">
                現在スコア : 0
            </div>

            <div class="stats">

                <div class="stat-box">
                    <div class="stat-label">目標</div>
                    <div id="target" class="stat-value">10</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">射数</div>
                    <div id="shotCount" class="stat-value">0</div>
                </div>

            </div>

            <button class="settings-button"
                onclick="toggleSettings()">
                ⚙ 設定
            </button>

        </div>

        <div class="card">

            <div class="grid">

                <button onclick="addShot('X',10)">X</button>
                <button onclick="addShot('10',10)">10</button>
                <button onclick="addShot('9',9)">9</button>
                <button onclick="addShot('8',8)">8</button>

                <button onclick="addShot('7',7)">7</button>
                <button onclick="addShot('6',6)">6</button>
                <button onclick="addShot('5',5)">5</button>
                <button onclick="addShot('4',4)">4</button>

                <button onclick="addShot('3',3)">3</button>
                <button onclick="addShot('2',2)">2</button>
                <button onclick="addShot('1',1)">1</button>
                <button onclick="addShot('M',0)">M</button>

            </div>

            <button class="clear-button"
                onclick="undoShot()">
                CLEAR
            </button>

        </div>

        <div class="card">

            <h2>履歴</h2>

            <div id="history" class="history">
            </div>

        </div>

    </div>



    <!-- 結果画面 -->
    <div id="resultScreen">

        <div class="result-card">

            <h1>🎉 CLEAR !</h1>

            <div id="resultShots" class="result-item">
            </div>

            <div id="resultAverage" class="result-item">
            </div>

            <div id="result72" class="result-item">
            </div>

            <div id="resultGold" class="result-item">
            </div>

        </div>

        <div class="result-card">

            <h2>結果詳細</h2>

            <div id="resultCounts">
            </div>

        </div>

        <button class="restart-button"
            onclick="restartGame()">
            もう一度始める
        </button>

    </div>



    <!-- 設定画面 -->
    <div id="settings">

        <div class="settings-header">

            <button class="back-button"
                onclick="toggleSettings()">
                ← 戻る
            </button>

            <h1>設定</h1>

        </div>

        <div class="settings-content">

            <div class="setting-row">
                <label>目標スコア</label>
                <input id="targetInput"
                    type="number"
                    value="10">
            </div>

            <hr>

            <div class="setting-row">
                <label>X</label>
                <input id="pointX" type="number" value="1">
            </div>

            <div class="setting-row">
                <label>10</label>
                <input id="point10" type="number" value="0">
            </div>

            <div class="setting-row">
                <label>9</label>
                <input id="point9" type="number" value="-1">
            </div>

            <div class="setting-row">
                <label>8</label>
                <input id="point8" type="number" value="-1">
            </div>

            <div class="setting-row">
                <label>7</label>
                <input id="point7" type="number" value="-1">
            </div>

            <div class="setting-row">
                <label>6</label>
                <input id="point6" type="number" value="-1">
            </div>

            <div class="setting-row">
                <label>5</label>
                <input id="point5" type="number" value="-1">
            </div>

            <div class="setting-row">
                <label>4</label>
                <input id="point4" type="number" value="-1">
            </div>

            <div class="setting-row">
                <label>3</label>
                <input id="point3" type="number" value="-1">
            </div>

            <div class="setting-row">
                <label>2</label>
                <input id="point2" type="number" value="-1">
            </div>

            <div class="setting-row">
                <label>1</label>
                <input id="point1" type="number" value="-1">
            </div>

            <div class="setting-row">
                <label>M</label>
                <input id="pointM" type="number" value="-1">
            </div>

            <button class="save-button"
                onclick="saveSettings()">
                保存
            </button>

            <button class="reset-button"
                onclick="resetAll()">
                リセット
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
